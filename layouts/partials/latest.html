<!-- Latest news start -->
<section id="latestnews">
  <div class="container">

    <!-- Intro -->
    <div class="row">
      <div class="section-title reveal">
        <h2>{{ .Site.Params.latest.title }}</h2>
      </div>
    </div>

    <!-- Cards -->
    <div class="row news-row">
      {{ range $i, $article := first 3 (where .Site.Pages "Type" "news") }}
      <div class="col-sm-4">
        <article class="news-card reveal" style="--reveal-delay: {{ mul $i 80 }}ms">
          <a href="{{ .RelPermalink }}" title="{{ .Title | markdownify }}">
            <time class="news-date" datetime="{{ .Date.Format "2006-01-02" }}"
              title="Published: {{ .Date.Format .Site.Params.date_format }}">
              <span class="news-day">{{ .Date.Format "2" }}</span>
              <span class="news-month">{{ .Date.Format "Jan 2006" }}</span>
            </time>
            <h3 class="news-title">{{ .Title | markdownify }}</h3>
            <p class="news-summary">{{ .Summary | plainify | truncate 130 }}</p>
            <span class="news-more">Read more <i class="gs-mdi-arrow-right-bold-circle"></i></span>
          </a>
        </article>
      </div>
      {{ end }}
    </div>

    <div class="row">
      <a href="/news" class="next">All news <i class="gs-mdi-arrow-right-bold-circle"></i></a>
    </div>
  </div>
</section>
