<!-- Links Start -->
<section id="links">
  <div class="container">

    <!-- Intro -->
    <div class="row">
      <div class="section-title reveal">
        <h2>{{ hugo.Data.links.title }}</h2>
        <p>{{ hugo.Data.links.subtitle }}</p>
      </div>
    </div>

    <!-- Content -->
    <div class="row">
      {{ range $i, $link := hugo.Data.links.content }}
      <div class="links-item reveal" style="--reveal-delay: {{ mul (mod $i 4) 80 }}ms">
        <i class="{{ $link.icon }}"></i>
        <div>
          <a href="{{ $link.url }}" alt="{{ $link.name }}">
            <h4>{{ $link.name }}</h4>
          </a>
          <p>{{ $link.text | markdownify }}</p>
        </div>

      </div>
      {{ end }}
    </div>
  </div>
</section>
