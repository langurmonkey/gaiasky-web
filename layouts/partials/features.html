<!-- Features Start -->
<section id="features">
  <div class="container">

    <!-- Intro -->
    <div class="row">
      <div class="section-title reveal">
        <h2>{{ hugo.Data.features.title }}</h2>
        <p>{{ hugo.Data.features.subtitle }}</p>
      </div>
    </div>

    <!-- Content -->
    <div class="row">
      {{ range $i, $feature := hugo.Data.features.content }}
      <div class="col-sm-6 col-md-3">
        <div class="features-item reveal" style="--reveal-delay: {{ mul (mod $i 4) 80 }}ms">
          <i class="{{ $feature.icon }}"></i>
          <h4>{{ $feature.name }}</h4>
          <p>{{ $feature.text | markdownify }}</p>
        </div>
      </div>
      {{ end }}
    </div>
  </div>
</section>
